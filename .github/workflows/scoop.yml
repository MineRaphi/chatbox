# Keeps the Scoop manifest (bucket/chatbox.json) pointing at the newest
# release, so `scoop update chatbox` finds it.
#
# Runs when a release is published (the Publish button on a draft), for
# beta versions too. It can also be run by hand from the Actions tab with
# a tag, e.g. to go back to an older version.
name: Scoop manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point the manifest at, e.g. v2.1.0
        required: true

# Commits the manifest to main.
permissions:
  contents: write

concurrency:
  group: scoop-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Write the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            | node scripts/update-scoop-manifest.mjs

      - name: Commit it
        run: |
          if git diff --quiet -- bucket/chatbox.json; then
            echo "The manifest already points at $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/chatbox.json
          git commit -m "Scoop: Chatbox ${TAG#v}"
          git push origin main
