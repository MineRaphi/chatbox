# Builds Chatbox for macOS (Apple Silicon and Intel), Windows and Linux.
#
# - Push a tag like v2.0.1 (matching "version" in package.json): the builds
#   are attached to a draft GitHub Release. Check it, then click Publish.
# - Run it by hand from the Actions tab: it only builds, and the files are
#   kept as downloadable artifacts for 14 days. Nothing is released.
#
# Builds are unsigned on purpose; the README explains the one-time approval
# on macOS and Windows.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tag matches package.json version
        if: env.IS_RELEASE == 'true'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

  # Created once up front; the build jobs run in parallel and would otherwise
  # race to create it.
  prepare-release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v2.0.0-beta and similar are marked as pre-releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft $prerelease \
              --title "Chatbox ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  build:
    needs: [check, prepare-release]
    # Run for manual builds too, where prepare-release is skipped.
    if: always() && needs.check.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            arch: arm64
          - name: macOS Intel
            os: macos-latest
            arch: x64
          - name: Windows
            os: windows-latest
            arch: x64
          - name: Linux
            os: ubuntu-latest
            arch: x64
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The .rpm maker needs rpmbuild; .deb tools are already there.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Build first and test; for a release, the same files are uploaded
      # afterwards (release --from-make), so nothing untested gets published.
      - name: Build
        run: npm run make -- --arch=${{ matrix.arch }}

      # Install the .deb on this real Ubuntu machine and start the app on a
      # virtual display. Still running after 30 s (timeout's exit code 124)
      # means it started; anything else is a crash.
      - name: Smoke test the Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          sudo apt-get install -y ./out/make/deb/x64/*.deb
          set +e
          xvfb-run -a timeout 30 chatbox
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::chatbox exited with code $code within 30 s"
            exit 1
          fi
          echo "chatbox ran for 30 s without crashing"

      - name: Attach to the draft release
        if: env.IS_RELEASE == 'true'
        run: npm run release -- --from-make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the build as an artifact
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-${{ runner.os }}-${{ matrix.arch }}
          path: |
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/RELEASES
            out/make/**/*.nupkg
            out/make/**/*.deb
            out/make/**/*.rpm
          retention-days: 14
