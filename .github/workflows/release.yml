# Builds Chatbox for macOS (Apple Silicon and Intel), Windows and Linux.
#
# - Push a tag like v2.0.1 (matching "version" in package.json): the builds
#   are attached to a draft GitHub Release. Check it, then click Publish.
# - Run it by hand from the Actions tab: it only builds, and the files are
#   kept as downloadable artifacts for 14 days. Nothing is released.
#
# Builds are unsigned on purpose; the README explains the one-time approval
# on macOS and Windows.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Tag matches package.json version
        if: env.IS_RELEASE == 'true'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

  # Created once up front; the build jobs run in parallel and would otherwise
  # race to create it.
  prepare-release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v2.0.0-beta and similar are marked as pre-releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft $prerelease \
              --title "Chatbox ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  build:
    needs: [check, prepare-release]
    # Run for manual builds too, where prepare-release is skipped.
    if: always() && needs.check.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            arch: arm64
          - name: macOS Intel
            os: macos-latest
            arch: x64
          - name: Windows
            os: windows-latest
            arch: x64
          # Pinned: ubuntu-latest moved to Ubuntu 26, whose rpm (4.20+)
          # builds in a different directory; electron-installer-redhat 4.0.0
          # (latest) still copies from the old one and the .rpm build fails
          # with "cp: cannot stat 'usr/*'". Ubuntu 24.04 has rpm 4.18.
          - name: Linux
            os: ubuntu-24.04
            arch: x64
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # rpmbuild for the .rpm, mksquashfs for the AppImage, xvfb for the
      # startup tests; plus the pinned, checksum-verified AppImage runtime.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm squashfs-tools xvfb
          scripts/fetch-appimage-runtime.sh

      # Build first and test; for a release, the same files are uploaded
      # afterwards (release --from-make), so nothing untested gets published.
      - name: Build
        run: npm run make -- --arch=${{ matrix.arch }}

      # Startup tests on this real x64 Ubuntu machine: each starts the app
      # on a virtual display and fails if it crashes within 30 s.
      - name: Smoke test the .deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./out/make/deb/x64/*.deb
          scripts/smoke-test.sh chatbox
          sudo apt-get remove -y chatbox

      # AppImages can't ship Chromium's setuid sandbox helper and rely on
      # unprivileged user namespaces, which Arch and NixOS allow but Ubuntu
      # 24.04 restricts; allow them here to test like those systems.
      - name: Allow unprivileged user namespaces (like Arch and NixOS)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test the AppImage
        if: runner.os == 'Linux'
        run: |
          appimage="$(find out/make -name '*.AppImage' | head -1)"
          chmod +x "$appimage"
          # No FUSE needed: unpack to a temp dir and run from there.
          APPIMAGE_EXTRACT_AND_RUN=1 scripts/smoke-test.sh "$appimage"

      # How the NixOS friends will run it: nix's appimage-run.
      - name: Install Nix
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@v31

      - name: Smoke test the AppImage with nix appimage-run
        if: runner.os == 'Linux'
        run: |
          appimage="$(find out/make -name '*.AppImage' | head -1)"
          nix build --no-link nixpkgs#appimage-run   # download outside the timed run

          # appimage-run's sandbox has no fonts on this Ubuntu runner, and
          # Chromium aborts without any ("Could not find any font"). A NixOS
          # desktop always has fonts configured, so give it one font set
          # the way NixOS would: a Nix font package plus a fontconfig file.
          fonts="$(nix build --no-link --print-out-paths nixpkgs#dejavu_fonts)"
          mkdir -p /tmp/chatbox-fonts
          cat > /tmp/chatbox-fonts/fonts.conf <<EOF
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <dir>${fonts}/share/fonts</dir>
            <cachedir>/tmp/chatbox-fonts/cache</cachedir>
          </fontconfig>
          EOF

          FONTCONFIG_FILE=/tmp/chatbox-fonts/fonts.conf SECONDS_TO_RUN=45 \
            scripts/smoke-test.sh nix run nixpkgs#appimage-run -- "$appimage"

      - name: Attach to the draft release
        if: env.IS_RELEASE == 'true'
        run: npm run release -- --from-make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the build as an artifact
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chatbox-${{ runner.os }}-${{ matrix.arch }}
          path: |
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/RELEASES
            out/make/**/*.nupkg
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.AppImage
          retention-days: 14
