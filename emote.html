<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Emote Page</title>
        <style>
            body, html {
                margin: 0;
                background: transparent;
                overflow: hidden;
            }

            #emoteImage {
                width: 100%;
                height: 100%;
                opacity: 0;
                transform: scale(0);
                animation: popUp 0.35s forwards, fadeOut 1s forwards 2.5s; /* pop then fade */
            }

            @keyframes popUp {
                to {
                opacity: 1;
                transform: scale(1);
                }
            }

            @keyframes fadeOut {
                to {
                opacity: 0;
                }
            }
        </style>
    </head>

    <body>
        <img id="emoteImage" src="" width="300px">
    </body>

    <script>
        const image = document.getElementById('emoteImage');
        const emoteId = window.location.hash.substring(1);
        image.src = `https://cdn.7tv.app/emote/${emoteId}/4x.webp`;
    </script>
</html>
