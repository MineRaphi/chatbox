<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
   <script>
    tailwind.config = { //fjaslkdfjlksa
      theme: {
        extend: {
          colors: {
            primary: '#1d4ed8'
          }
        }
      }
    }
  </script>

</head>
  <body>
    <div class="flex items-center justify-center min-h-screen bg-cover bg-center bg-gradient-to-br from-[var(--bg1)] to-[var(--bg2)]">
      <div class="titlebar self-start"></div>
      <div class="flex flex-col gap-6 max-w-sm mx-auto relative z-10">
        <button onclick="window.location.href='src/server.html'"
          class=" group relative p-4 rounded-2xl backdrop-blur-xl 
                bg-gradient-to-br shadow-2xl hover:shadow-2xl hover:scale-[1.02] 
                hover:-translate-y-1 active:scale-95 transition-all duration-500 
                ease-out cursor-pointer overflow-hidden"
        >
          <!-- Moving shine -->
          <div
            class="absolute inset-0 bg-gradient-to-r from-transparent 
                  via-[var(--btn-shine)] to-transparent 
                  -translate-x-full group-hover:translate-x-full 
                  transition-transform duration-1000 ease-out"
          ></div>

          <!-- Hover glow background -->
          <div
            class="absolute inset-0 rounded-2xl bg-gradient-to-r 
                  from-[var(--btn-glow-start)] via-[var(--btn-glow-mid)] 
                  to-[var(--btn-glow-start)] opacity-0 
                  group-hover:opacity-100 transition-opacity duration-500"
          ></div>

          <div class="relative z-10 flex items-center gap-4">
            <div
              class="p-3 rounded-lg bg-gradient-to-br 
                    from-[var(--icon-bg-start)] to-[var(--icon-bg-end)] 
                    backdrop-blur-sm transition-all duration-300"
            >
              <img
                src="img/thinking-4x.png"
                class="w-7 h-7 transition-all duration-300 
                      group-hover:scale-110 drop-shadow-lg"
                style="filter: var(--icon-filter);"
              >
            </div>

            <div class="flex-1 text-left">
              <p
                class="font-bold text-lg transition-colors duration-300 drop-shadow-sm"
                style="color: var(--text-title);"
              >
                Chatbox
              </p>
              <p
                class="text-sm transition-colors duration-300"
                style="color: var(--text-sub);"
              >
                Sign Up
              </p>
            </div>

            <div class="opacity-40 group-hover:opacity-100 group-hover:translate-x-1 
                        transition-all duration-300"
            >
              <svg viewBox="0 0 24 24" stroke="currentColor" fill="none"
                class="w-5 h-5"
                style="color: var(--arrow-color);"
              >
                <path d="M9 5l7 7-7 7" stroke-width="2" 
                      stroke-linejoin="round" stroke-linecap="round"></path>
              </svg>
            </div>
          </div>
        </button>
      </div>
    </div>
    <script type="module" src="src/themes.js"></script>
    <script type="module" src="scripts.js"></script>
  </body>
</html>
