<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbox</title>
  <link rel="stylesheet" type="text/css" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

   <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1d4ed8'
          }
        }
      }
    }
  </script>

</head>
  <body class="min-h-screen bg-gradient-to-br from-[var(--bg1)] to-[var(--bg2)]">
      <!-- Sidebar-->
      <div class="fixed left-4 top-4 bottom-4 w-20 border-2 border-white/20 bg-black/20 backdrop-blur-lg flex flex-col items-center py-4 space-y-4 rounded-3xl shadow-xl">
          <!-- Buttons -->
          <button id="profileBtn" class=" p-1 rounded-2xl hover:bg-neutral-600 transition cursor-pointer">
              <img class="w-8 h-8" src="../img/profileborder (2).png" style="width:48px; height:48px;">
          </button>

          <button id="chatBtn" class="p-1 rounded-2xl hover:bg-neutral-600 transition cursor-pointer">
              <img class="w-8 h-8" src="../img/chat2.png" style="width:48px; height:48px;">
          </button>

          <button id="emoteBtn" class=" p-3 rounded-2xl hover:bg-neutral-600 transition cursor-pointer">
              <img class="w-8 h-8 " src="../img/box.png">
          </button>
          
          <button id="uploadBtn" class="p-3 rounded-2xl hover:bg-neutral-600 transition cursor-pointer " onclick="location.href='upload.html'">
             <img class="w-8 h-8" src="../img/upload.png" alt="Upload">
          </button>


          <button id="settingsBtn" class=" p-3 rounded-2xl hover:bg-neutral-600 transition cursor-pointer">
              <img class="w-8 h-8" src="../img/settings.png">
          </button>
          
          <button class="p-3 rounded-2xl hover:bg-neutral-600 transition cursor-pointer mt-auto" onclick="location.href='SuperSecretPage.html'">
             <img class="w-8 h-8 relative top-0.5" src="../img/arrowDown.svg">
          </button>
      </div>

      <!--Bottom bar -->
      <div class="fixed bottom-4 h-20 left-28 right-4
                  border-2 border-white/20 bg-black/20 backdrop-blur-lg
                  flex flex-row justify-around items-center py-4
                  rounded-3xl shadow-xl space-x-4">
      </div>

      <!-- Main content -->
      <div id="mainContent" class="p-6">
                <!-- Chat Panel -->
        <div id="chatPanel" class="hidden hide-scrollbar fixed bottom-30 mt-5 ml-70 left-28 right-4 h-110 border-2 border-white/20 bg-black/20 backdrop-blur-lg rounded-xl shadow-xl p-4 flex flex-col">
            <div id="chatMessages" class="hide-scrollbar flex-1 overflow-y-auto mb-2"></div>
            <input id="chatInput" type="text" placeholder="write something" 
                  class="text-white caret-white placeholder-white/50 rounded-lg w-full p-2 rounded border-white/20 bg-black/20 backdrop-blur-lg focus:outline-none"/>
        </div>

                <!-- Emote Panel -->
          <div id="emotePanel" class="hidden hide-scrollbar fixed bottom-30 mt-5 ml-70 left-28 right-4 h-110 border-2 border-white/20 bg-black/20 backdrop-blur-lg rounded-xl shadow-xl p-4 flex flex-col">
              <input id="emoteSearch"
                    type="text"
                    placeholder="search emotes"
                    class="mb-3 p-2 rounded bg-black/30 border border-white/20 text-white outline-none">

              <div id="emoteGrid" class="grid grid-cols-4 gap-2 overflow-y-auto pr-2"></div>

          </div>

        <!--Emotebox-->
        <div id="emotePopup" 
     style="display:none; position:absolute; bottom:80px; left:30px; 
            background:#000000cc; backdrop-filter:blur(6px);
            border:1px solid #ffffff30; border-radius:10px; 
            padding:6px; width:220px; max-height:200px; 
            overflow-y:auto; z-index:999;">
        </div>

            
      </div>

      <!--Settings Panel-->
  <div id="settingsPanel" class="fixed top-5 left-28 text-white w-65 h-110 mt-5 border-white/20 bg-black/20 border-2 backdrop-blur-lg  rounded-xl shadow-xl p-6 hidden">
    <h2 class="text-xl font-bold mb-4">Settings</h2>
    <button id="purpleBtn"> Purple Theme </button>
    <button id="redBtn"> Red Theme </button>
    <button id="closeSettings" class="mt-4 px-3 py-1 bg-gray-300 rounded hover:bg-gray-400 transition"> <img src=""> Close Settings </button>
  </div>

        <!--Chat + Emote Panel Script-->
    <script>
      const chatBtn = document.getElementById('chatBtn');
      const chatPanel = document.getElementById('chatPanel');
      const emoteBtn = document.getElementById('emoteBtn');
      const emotePanel = document.getElementById('emotePanel');


      chatBtn.addEventListener('click', () => {
        chatPanel.classList.toggle('hidden');
        emotePanel.classList.add('hidden');
      });

      emoteBtn.addEventListener('click', () => {
        emotePanel.classList.toggle('hidden');
        chatPanel.classList.add('hidden');
      });
    </script>

        <!--Settings Panel-->
    <script>
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsPanel = document.getElementById('settingsPanel');
      const closeSettings = document.getElementById('closeSettings');

      const profilePanel2 = document.getElementById('profilePanel'); 

      settingsBtn.addEventListener('click', () => {
        settingsPanel.classList.toggle('hidden');
        profilePanel.classList.add('hidden');   
      });

      closeSettings.addEventListener('click', () => {
        settingsPanel.classList.add('hidden');
      });

      // Navigate to upload.html when upload button is clicked
      uploadBtn.addEventListener('click', () => {
        window.location.href = 'upload.html';
      });
    </script>

          <!--Profile Panel-->
  <div id="profilePanel" class="fixed top-5 left-28 text-white w-65 h-110 mt-5 border-white/20 bg-black/20 border-2 backdrop-blur-lg  rounded-xl shadow-xl p-6 hidden">
    <h2 class="text-xl font-bold mb-4">-Username-</h2>
    <p></p>
    <button id="closeProfile" class="mt-4 mr-4 object-top-left px-3 py-1 bg-gray-300 rounded hover:bg-gray-400 transition"> <img src=""> </button>
  </div>
    <script>
      const profileBtn = document.getElementById('profileBtn');
      const profilePanel = document.getElementById('profilePanel');
      const closeProfile = document.getElementById('closeProfile');

      const settingsPanel2 = document.getElementById('settingsPanel'); 
     
      profileBtn.addEventListener('click', () => {
        profilePanel.classList.toggle('hidden');
        settingsPanel.classList.add('hidden');  
      });

      closeProfile.addEventListener('click', () => {
        profilePanel.classList.add('hidden');
      });
    </script>


    <script type="module" src="../scripts.js"></script>
    <script type="module" src="themes.js"></script>
    <script type="module" src="emotes.js"></script>
    <script type="module" src="chat.js"></script>
  </body>
</html>
