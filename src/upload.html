<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload — Chatbox</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#1d4ed8' } } } }
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-neutral-800 to-purple-500 text-white">
  <div class="max-w-3xl mx-auto p-6">
    <div class="max-w-3xl mx-auto p-6 mt-12">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Upload</h1>
        <a href="main.html" class="back-btn"  role="button" aria-label="Go back" tabindex="0">
          <img src="../img/back.png" alt="back">
        </a>
    </header>

    <!-- Upload -->
    <section class="bg-black/20 backdrop-blur-lg rounded-xl p-6 shadow-lg">


      <!-- Picture Drag & Drop upload -->
      <div id="dropZone" class="border-2 border-dashed border-white/20 rounded-md p-8 text-center cursor-pointer hover:border-white/40 transition">
        <img src="../img/upload.png" alt="Upload icon" class="mx-auto w-14 h-14 mb-3">
        <p class="font-semibold">Drag & Drop images here</p>
        <p class="text-xs text-white/70">or</p>
        <button id="selectBtn" class="mt-3 px-4 py-2 bg-primary rounded-md">Select images</button>
        <input id="fileInput" type="file" accept="image/*" class="hidden" multiple aria-label="Image input">
      </div>

      <div id="previewArea" class="mt-6 grid grid-cols-1 gap-4"></div>

      <div class="mt-4 flex items-center gap-4">
        <button id="clearBtn" class="px-3 py-2 bg-red-600 rounded-md">Clear</button>
      </div>
    </section>
  </div>

  <script>

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const selectBtn = document.getElementById('selectBtn');
    const previewArea = document.getElementById('previewArea');
    const clearBtn = document.getElementById('clearBtn');

    let files = [];

    function isImage(file) {
      if (!file) return false;
      if (file.type && file.type.startsWith('image/')) return true;
      return /\.(jpe?g|png|gif|webp|bmp|svg)$/i.test(file.name);
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B','KB','MB','GB','TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function renderPreview() {
      previewArea.innerHTML = '';
      if (!files.length) return;
      files.forEach((file, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center gap-4 bg-white/5 p-3 rounded';


        if (isImage(file)) {
          const thumb = document.createElement('img');
          thumb.src = URL.createObjectURL(file);
          thumb.className = 'w-16 h-12 object-cover rounded';
          item.appendChild(thumb);
        }

        const info = document.createElement('div');
        info.className = 'flex-1';
        const name = document.createElement('div');
        name.textContent = file.name;
        const meta = document.createElement('div');
        meta.className = 'text-xs text-white/70';
        meta.textContent = `${file.type || 'image'} — ${formatBytes(file.size)}`;

        info.appendChild(name);
        info.appendChild(meta);

        const remove = document.createElement('button');
        remove.className = 'px-2 py-1 bg-red-500 rounded text-xs';
        remove.textContent = 'Remove';
        remove.addEventListener('click', () => {
          files.splice(idx, 1);
          renderPreview();
        });

        item.appendChild(info);
        item.appendChild(remove);
        previewArea.appendChild(item);
      });
    }

    // File selection
    selectBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const picked = Array.from(e.target.files || []).filter(isImage);
      files = files.concat(picked);
      renderPreview();
    });

    // Drag & drop
    ['dragenter','dragover'].forEach(evt => dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('border-white/40'); }));
    ['dragleave','drop'].forEach(evt => dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('border-white/40'); }));
    dropZone.addEventListener('drop', (e) => {
      const dropped = Array.from(e.dataTransfer.files || []).filter(isImage);
      if (dropped.length) {
        files = files.concat(dropped);
        renderPreview();
      }
    });

    clearBtn.addEventListener('click', () => { files = []; fileInput.value = ''; renderPreview(); });

    renderPreview();

 
      document.querySelectorAll('..backButton').forEach(btn => {
        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const href = btn.getAttribute('href');
            if (href) window.location.href = href;
          }
        });
        // Ensure the anchor is tabbable (anchor normally is) and add a subtle focus class
        btn.addEventListener('click', (e) => {
          // click handled by anchor href by default; no-op here but keeps behavior consistent
        });
      });
  </script>
</body>
</html>
