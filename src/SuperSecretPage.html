<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbox</title>
  <link rel="stylesheet" type="text/css" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

   <script>
    tailwind.config = { //fjaslkdfjlksa
      theme: {
        extend: {
          colors: {
            primary: '#1d4ed8'
          }
        }
      }
    }
  </script>

</head>
  <body style="background-image: url('../img/pixelbg\ V2.gif');" class="relative bg-[right_30%_center] min-h-screen bg-center bg-cover bg-no-repeat" >
    <div>
      <button class="text-neutral-600 transparentButton top-10 left-5" onclick="location.href='main.html'">/\</button>
      <button id="computerBtn" class="top-[335px] right-[210px] transparentButton w-[60px] h-[30px]"></button>
    </div>

    <div id="computerPanel">

        <button id="computerClose" class="top-1 right-2.5 absolute cursor-pointer">X</button>
        <button id="computerBack" class="top-1 right-6 absolute hidden cursor-pointer">H</button>

        <div class="computerPage" id="page-home">
            <button id="bogoSortBtn" class="absolute object-top-left top-1 left-2.5 cursor-pointer">Quantum Bogo Sort</button>
        </div>

        <div class="computerPage hidden" id="page-bogo">
            <div class="bogo-container">
              <input id="numInput" type="text" placeholder="Enter numbers separated by commas" class="border border-gray-400 rounded px-2 py-1 w-64"/>
              <button id="startBtn" class="ml-2 px-3 py-1 bg-purple-600 text-white rounded hover:bg-purple-700">Start BogoSort</button>
              <button id="stopBtn"  class="ml-2 px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700">Stop</button>
              <div id="visualizer" class="flex gap-1 mt-4 h-48 items-end border border-gray-300 p-2 rounded bg-gray-100 overflow-x-auto"></div>
            </div>
        </div>
    </div>
    <script type="module" src="BtnScripts.js"></script>
    <script type="module" src="../scripts.js"></script>
  </body>
</html>
