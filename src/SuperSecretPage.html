<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://unpkg.com/98.css">

   <script>
    tailwind.config = { //fjaslkdfjlksa
      theme: {
        extend: {
          colors: {
            primary: '#1d4ed8'
          }
        }
      }
    }
  </script>

</head>
  <!--background img-->
  <body style="background-image: url('../img/pixelbg\ V2.gif');" class="relative bg-[right_30%_center] min-h-screen bg-center bg-cover bg-no-repeat" >
    <div>
      <!--Buttons on BG-->
      <button class="no98 text-neutral-600 transparentButton top-10 left-5" onclick="location.href='main.html'">/\</button>
      <button id="computerBtn" class="no98 top-[335px] right-[210px] transparentButton w-[60px] h-[30px]"></button>
    </div>

    <!--The Computer Panel-->
    <div id="computerPanel">

        <!--Titlebar-->
        <div id="computerBack" class="title-bar">
          <div class="title-bar-text">Very Secret Computer</div>
          <div class="title-bar-controls">
            <button id="computerBack" aria-label="Minimize"></button>
            <button id="computerClose" aria-label="Close"></button>
          </div>
        </div>

        <!--Buttons on Computerpanel-->
        <div class="relative" id="page-home">
            <button id="bogoSortBtn" class="absolute object-top-left top-1 left-2.5 cursor-pointer default">Sorting Algorithms</button>
            <button id="nextDayBtn" class="absolute object-top-left top-1 left-30 cursor-pointer default">Next Day</button>
            <button id="prevDayBtn" class="absolute object-top-left top-1 left-49.5 cursor-pointer default">Previous Day</button>
            <button id="vincentBtn" class="absolute object-top-left top-1 left-72 cursor-pointer default">Vincent Archive</button>
        </div>

        <!--Vincent Page-->
        <div class="computerPage hidden" id="page-vincent">
          <div class="p-2 flex flex-col gap-3">
            <select id="vincentSelect" class="px-2 py-1 rounded bg-white/90 text-black w-56">
              <option value="">-- Select --</option>
              <option value="vinfo1">Vincent ist ein schlechter Jungler</option>
              <option value="vinfo2">Vincent ist ein schlechter Jungler V2</option>
            </select>

            <div id="vincentText"
                class=" p-2 border border-gray-300 rounded bg-white/90 text-black text-sm w-140 min-h-16 max-h-90 overflow-y-auto whitespace-pre-line">
            </div>

          </div>
        </div>

        <!---Sorting Algos Page-->
        <div class="computerPage hidden" id="page-bogo">
          <div class="bogo-container relative top-2 left-2 flex flex-col gap-3">

            <div class="flex items-center gap-2">
              <input id="numInput-sort" type="text"
                    placeholder="Enter numbers separated by commas"
                    class="border border-gray-400 rounded px-2 py-1 w-84" />

              <button id="startBtn-sort" class="px-3 py-1">Start</button>
              <button id="stopBtn-sort" class="px-3 py-1">Stop</button>
            </div>

            <div class="flex gap-4 items-start">

              <div id="visualizer-sort"
                  class="flex gap-1 w-80 h-48 items-end border border-gray-300
                          p-2 rounded-md bg-gray-100 overflow-x-auto">
              </div>

              <div id="algoDesc-sort"
                  class="whitespace-pre-line text-sm text-gray-700 max-w-[200px]"
                  aria-live="polite">
                Select an algorithm to see a short description.
              </div>
            </div>

            <div class="w-84 flex items-center gap-2">
              <input id="speedSlider-sort" type="range" min="10" max="1000" value="50" />
              <span id="speedLabel-sort">50 ms</span>

              <label for="algoSelect-sort" class="ml-3 text-sm">Algorithm:</label>
              <select id="algoSelect-sort"
                      class="ml-1 px-2 py-1 rounded bg-white/90 text-black">
                <option value="visualBogoSort">BogoSort</option>
                <option value="visualBubbleSort">BubbleSort</option>
                <option value="visualQuickSort">QuickSort</option>
                <option value="visualStalinSort">StalinSort</option>
                <option value="visualMiracleSort">MiracleSort</option>
              </select>
            </div>
          </div>
        </div>
        
        <!--Next day Calc-->
        <div class="computerPage hidden" id="page-nextday">
            <div class="nextday-container relative top-2 left-2">
              <button id="calculateBtn" class="px-3 py-1">Calculate Next Day</button>
              <div id="result" class="mt-5 p-1 border border-gray-300 rounded bg-white/90 text-black text-sm overflow-hidden w-96" style="min-height: 30px;">
                The next day is gonna be
              </div>
            </div>
        </div>
        
        <!--Previous day Calc-->
        <div class="computerPage hidden" id="page-prevday">
            <div class="prevday-container relative top-2 left-2">
              <button id="calculatePrevBtn" class="px-3 py-1">Calculate Previous Day</button>
              <div id="resultPrev" class="mt-5 p-1 border border-gray-300 rounded bg-white/90 text-black text-sm overflow-hidden w-96" style="min-height: 30px;">
                The previous day was
              </div>
            </div>
        </div>

    </div>
    <script type="module" src="btnScripts.js"></script>
    <script type="module" src="../scripts.js"></script>
  </body>
</html>
